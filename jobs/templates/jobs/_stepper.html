<ol class="steps">
  {% for s in steps %}
    <li class="step {{ s.state }}{% if s.active %} active{% endif %}">
      {% if s.url %}<a href="{{ s.url }}">{{ s.label }}</a>{% else %}<span>{{ s.label }}</span>{% endif %}
    </li>
  {% endfor %}
</ol>
<script>
  // On a phone the bar scrolls sideways, so bring the step you're on into view
  (function () {
    var here = document.querySelector('.steps .step.active') || document.querySelector('.steps .step.current');
    if (here) { here.scrollIntoView({ inline: 'center', block: 'nearest' }); }
  })();
</script>
