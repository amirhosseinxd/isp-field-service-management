<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSM{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family:  Tahoma, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex;
             justify-content: space-between; align-items: center; }
    header form { margin: 0; }
    main { max-width: 480px; margin: 24px auto; padding: 0 16px; }
    main.wide { max-width: 1100px; }
    main.wide { font-size: 14px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    input { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    .ltr { direction: ltr; text-align: left; }
    button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 8px;
             background: #2f6fdb; color: #fff; cursor: pointer; }
    header button { background: #fff; color: #1f3a5f; padding: 8px 12px; }
    .login-btn { width: 100%; }
    .error { color: #b00020; margin-bottom: 12px; }
    .msg { background: #e8f0fe; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .msg.error { background: #fde8e8; color: #b00020; }
    .msg.success { background: #e6f4ea; color: #1e6b34; }
    .msg.warning { background: #fff4e0; color: #8a5a00; }

    .steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 16px; }
    .step { flex: 1; text-align: center; font-size: 13px; padding: 8px 4px; border-radius: 8px;
        background: #e3e6ea; color: #777; }
    .step a { color: inherit; text-decoration: none; display: block; }
    .step.done { background: #d6efdc; color: #1e6b34; }
    .step.current { background: #2f6fdb; color: #fff; }
    .step.active { outline: 2px solid #1f3a5f; }

    .btn { display: block; width: 100%; text-align: center; text-decoration: none; padding: 12px 16px;
       font-size: 16px; border: 0; border-radius: 8px; background: #2f6fdb; color: #fff;
       cursor: pointer; margin-top: 12px; box-sizing: border-box; }
    .btn.disabled, button:disabled { background: #b9c0cc; cursor: not-allowed; }
    .hint { color: #666; font-size: 14px; }

    a.card { display: block; text-decoration: none; color: inherit; margin-bottom: 12px; }
    .badge { background: #e3e6ea; border-radius: 12px; padding: 2px 10px; font-size: 13px; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
              gap: 8px; margin-top: 16px; }
    .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    textarea { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box;
           margin: 6px 0 14px; font-family: inherit; }

    header nav a { color: #fff; text-decoration: none; margin-inline: 10px; }
    select { width: 100%; padding: 12px; font-size: 16px; margin: 6px 0 14px;
         box-sizing: border-box; font-family: inherit; }

    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
           gap: 0 16px; margin-bottom: 16px; }
    .filter-actions { display: flex; align-items: center; gap: 16px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; }
    th, td { padding: 6px 10px; border-bottom: 1px solid #eee; text-align: start; white-space: nowrap; font-size: 14px; }
    th { background: #f0f2f5; }

    .pager { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 20px 0; }

    .photo-grid figure { margin: 0; }
    .photo-grid figcaption { font-size: 12px; color: #666; margin-top: 4px; }
    .photo-grid.big { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    button.danger { background: #c62828; }
    button.small { padding: 6px 10px; font-size: 14px; width: 100%; margin-top: 4px; }
    .photo-grid figure { margin: 0; }

    .photo-grid video { width: 100%; border-radius: 8px; background: #000; }

    .jalali-field-wrap { position: relative; display: block; }
    .jalali-field-wrap input { padding-left: 40px; }
    .jalali-icon-btn {
           position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
           width: 32px; height: 32px; border: 0; background: transparent; font-size: 18px;
           cursor: pointer; padding: 0;
           }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
</head>
<body>
    {% if user.is_authenticated %}
  <header>
    <span>{{ user.get_full_name|default:user.username }}</span>
    {% if user.is_support_admin %}
    <nav>
      <a href="{% url 'support_dashboard' %}">کارها</a>
      <a href="{% url 'photo_history' %}">آرشیو مدیا</a>
      <a href="{% url 'customer_list' %}">مشتریان</a>
    </nav>
    {% endif %}
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">خروج</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
  {% for message in messages %}
    <div class="msg {{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.jQuery || !jQuery.fn.pDatepicker) return;

  function enhance(selector, format, withTime) {
    document.querySelectorAll(selector).forEach(function (input) {
      if (input.dataset.jalaliReady) return;
      input.dataset.jalaliReady = '1';

      var wrap = document.createElement('span');
      wrap.className = 'jalali-field-wrap';
      input.parentNode.insertBefore(wrap, input);
      wrap.appendChild(input);

      var icon = document.createElement('button');
      icon.type = 'button';
      icon.className = 'jalali-icon-btn';
      icon.setAttribute('aria-label', 'انتخاب تاریخ');
      icon.textContent = '📅';
      wrap.appendChild(icon);
      icon.addEventListener('click', function () { input.focus(); });

      var options = { format: format, autoClose: true, initialValue: false };
      if (withTime) {
        options.timePicker = { enabled: true };
      }
      jQuery(input).pDatepicker(options);
    });
  }

  enhance('.jalali-date', 'YYYY/MM/DD', false);
  enhance('.jalali-datetime', 'YYYY/MM/DD HH:mm', true);
});
</script>
</body>
</html>
