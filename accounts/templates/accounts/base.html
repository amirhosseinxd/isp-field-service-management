<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSM{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family:  Tahoma, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex;
             justify-content: space-between; align-items: center; }
    header form { margin: 0; }
    main { max-width: 480px; margin: 24px auto; padding: 0 16px; }
    main.wide { max-width: 1100px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    input { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    .ltr { direction: ltr; text-align: left; }
    button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 8px;
             background: #2f6fdb; color: #fff; cursor: pointer; }
    header button { background: #fff; color: #1f3a5f; padding: 8px 12px; }
    .login-btn { width: 100%; }
    .error { color: #b00020; margin-bottom: 12px; }
    .msg { background: #e8f0fe; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .msg.error { background: #fde8e8; color: #b00020; }
    .msg.success { background: #e6f4ea; color: #1e6b34; }
    .msg.warning { background: #fff4e0; color: #8a5a00; }

    .steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 16px; }
    .step { flex: 1; text-align: center; font-size: 13px; padding: 8px 4px; border-radius: 8px;
        background: #e3e6ea; color: #777; }
    .step a { color: inherit; text-decoration: none; display: block; }
    .step.done { background: #d6efdc; color: #1e6b34; }
    .step.current { background: #2f6fdb; color: #fff; }
    .step.active { outline: 2px solid #1f3a5f; }

    .btn { display: block; width: 100%; text-align: center; text-decoration: none; padding: 12px 16px;
       font-size: 16px; border: 0; border-radius: 8px; background: #2f6fdb; color: #fff;
       cursor: pointer; margin-top: 12px; box-sizing: border-box; }
    .btn.disabled, button:disabled { background: #b9c0cc; cursor: not-allowed; }
    .hint { color: #666; font-size: 14px; }

    a.card { display: block; text-decoration: none; color: inherit; margin-bottom: 12px; }
    .badge { background: #e3e6ea; border-radius: 12px; padding: 2px 10px; font-size: 13px; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
              gap: 8px; margin-top: 16px; }
    .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    textarea { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box;
           margin: 6px 0 14px; font-family: inherit; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <span>{{ user.get_full_name|default:user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">خروج</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
  {% for message in messages %}
    <div class="msg {{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
