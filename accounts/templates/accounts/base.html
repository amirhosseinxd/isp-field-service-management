<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSM{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family:  Tahoma, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex;
             justify-content: space-between; align-items: center; }
    header form { margin: 0; }
    main { max-width: 480px; margin: 24px auto; padding: 0 16px; }
    main.wide { max-width: 1100px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    input { width: 100%; padding: 12px; margin: 6px 0 14px; font-size: 16px; box-sizing: border-box; }
    .ltr { direction: ltr; text-align: left; }
    button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 8px;
             background: #2f6fdb; color: #fff; cursor: pointer; }
    header button { background: #fff; color: #1f3a5f; padding: 8px 12px; }
    .login-btn { width: 100%; }
    .error { color: #b00020; margin-bottom: 12px; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <span>{{ user.get_full_name|default:user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">خروج</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
