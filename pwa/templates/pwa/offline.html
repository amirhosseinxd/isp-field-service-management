<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14305a">
  <title>اتصال برقرار نیست</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f3f5f9; color: #1f2937; font-family: Tahoma, "Segoe UI", sans-serif; }
    .box { max-width: 380px; margin: 16px; padding: 28px 24px; text-align: center; background: #fff;
           border: 1px solid #dde3ec; border-radius: 16px; }
    .box svg { width: 56px; height: 56px; color: #14305a; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { font-size: 14px; line-height: 1.9; margin: 0 0 12px; color: #4b5563; }
    button { padding: 10px 22px; font-size: 15px; color: #fff; background: #14305a; border: 0;
             border-radius: 10px; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/>
    </svg>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای دیدن و ثبت کارها به اینترنت نیاز است. اتصال گوشی را بررسی کنید و دوباره تلاش کنید.</p>
    <p>برای اینکه اطلاعات قدیمی نمایش داده نشود، اطلاعات کارها روی گوشی ذخیره نمی‌شوند.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
