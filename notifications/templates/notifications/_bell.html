{% if notif %}
<div class="bell-wrap" id="bell"
     data-panel-url="{% url 'notification_panel' %}"
     data-csrf="{{ csrf_token }}">
  <button type="button" class="bell-btn" aria-label="اعلان‌ها" aria-expanded="false" aria-haspopup="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
    <span class="bell-badge"{% if not notif.unread %} hidden{% endif %}>{{ notif.badge }}</span>
  </button>

  <div class="bell-menu" hidden>
    <div class="bell-head">
      <strong>اعلان‌ها</strong>
      <button type="button" class="bell-action"
              data-url="{% url 'notification_read_all' %}">همه را خوانده‌شده کن</button>
    </div>
    <ul class="bell-list">{% include 'notifications/_items.html' %}</ul>
  </div>

  <script>
  (function () {
    var root = document.getElementById('bell');
    var btn = root.querySelector('.bell-btn');
    var menu = root.querySelector('.bell-menu');
    var badge = root.querySelector('.bell-badge');
    var list = root.querySelector('.bell-list');

    function getToken() {
      if (root.dataset.csrf && root.dataset.csrf !== 'NOTPROVIDED') {
        return root.dataset.csrf;
      }
      var tokenInput = document.querySelector('input[name=csrfmiddlewaretoken]');
      return tokenInput ? tokenInput.value : '';
    }

    function show(data, refreshList) {
      badge.textContent = data.badge;
      badge.hidden = data.unread === 0;
      if (refreshList) { list.innerHTML = data.html; }
    }
    function post(url) {
      return fetch(url, {
        method: 'POST', headers: { 'X-CSRFToken': getToken() }, credentials: 'same-origin'
      }).then(function (r) { return r.json(); });
    }
    function setOpen(open) {
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(menu.hidden); });
    document.addEventListener('click', function (e) { if (!root.contains(e.target)) { setOpen(false); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setOpen(false); } });

    // "Mark as read" and "mark all as read" buttons (they carry their address in data-url)
    menu.addEventListener('click', function (e) {
      var target = e.target.closest('[data-url]');
      if (!target) { return; }
      e.preventDefault();
      e.stopPropagation();
      post(target.dataset.url).then(function (data) { show(data, true); }).catch(function () {});
    });

    // Fresh data every minute while the page is visible; the list is left alone while it's open
    setInterval(function () {
      if (document.hidden) { return; }
      fetch(root.dataset.panelUrl, { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (data) { show(data, menu.hidden); })
        .catch(function () {});
    }, 60000);
  })();
  </script>
</div>
{% endif %}
